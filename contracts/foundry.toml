[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = false

# BOT Chain testnet — update with actual testnet values
[rpc_endpoints]
bot_mainnet = "${BOT_RPC_URL}"
# bot_testnet = "${BOT_TESTNET_RPC_URL}"

[etherscan]
bot_mainnet = { key = "${ETHERSCAN_API_KEY}", url = "${BOT_EXPLORER_API_URL}" }
